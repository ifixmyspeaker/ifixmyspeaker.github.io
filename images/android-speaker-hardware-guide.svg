<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="samsungGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335"/>
      <stop offset="50%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="xiaomiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#374151" stroke-width="1.5" rx="15"/>

  <!-- Title Badge -->
  <rect x="200" y="22" width="400" height="34" rx="17" fill="#1f2937" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ANDROID ACOUSTIC HARDWARE ARCHITECTURE</text>

  <!-- 3 Brand Columns -->
  <!-- 1. Samsung Galaxy -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="220" height="300" rx="12" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="28" rx="6" fill="#1e3a8a"/>
    <text x="110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bfdbfe" text-anchor="middle">SAMSUNG GALAXY</text>

    <!-- Visual Speaker Cutout (Pill slot on S24 / S23 / Ultra) -->
    <rect x="25" y="55" width="170" height="70" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="110" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Bottom Edge Grille</text>
    <!-- Single wide pill slot -->
    <rect x="40" y="88" width="140" height="14" rx="7" fill="#030712" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Unified Acoustic Slot</text>

    <!-- Key Characteristics -->
    <g transform="translate(15, 140)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• IP68 Membrane Seal</text>
      <text x="10" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">Gore-Tex water barrier</tspan>
        <tspan x="10" dy="12">directly behind acoustic slot.</tspan>
      </text>

      <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Built-in Diagnostics</text>
      <text x="10" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#60a5fa">
        <tspan x="10" dy="0">Dial *#0*# &gt; "Speaker" for</tspan>
        <tspan x="10" dy="12">split RCV / SPK hardware test.</tspan>
      </text>

      <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Cleaning Tip</text>
      <text x="10" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">Slanted slot collects lint easily;</tspan>
        <tspan x="10" dy="12">clean with dry soft bristles.</tspan>
      </text>
    </g>
  </g>

  <!-- 2. Google Pixel -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="220" height="300" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="28" rx="6" fill="#064e3b"/>
    <text x="110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">GOOGLE PIXEL</text>

    <!-- Visual Speaker Cutout (Symmetric twin cutouts on 8 / 9 Pro) -->
    <rect x="25" y="55" width="170" height="70" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="110" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Dual Symmetrical Cutouts</text>
    <!-- Left mic slot, Right speaker slot -->
    <rect x="40" y="88" width="55" height="14" rx="7" fill="#030712" stroke="#ef4444" stroke-width="1.2"/>
    <text x="67" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#f87171" text-anchor="middle">MIC</text>
    <rect x="125" y="88" width="55" height="14" rx="7" fill="#030712" stroke="#10b981" stroke-width="1.2"/>
    <text x="152" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#34d399" text-anchor="middle">SPEAKER</text>

    <!-- Key Characteristics -->
    <g transform="translate(15, 140)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Spatial Audio Tuning</text>
      <text x="10" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">Tight DSP limits max</tspan>
        <tspan x="10" dy="12">excursions to avoid clipping.</tspan>
      </text>

      <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Top Ear Slit</text>
      <text x="10" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#34d399">
        <tspan x="10" dy="0">Narrow 0.5mm razor slit</tspan>
        <tspan x="10" dy="12">located at front glass edge.</tspan>
      </text>

      <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Ejection Frequency</text>
      <text x="10" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">165Hz - 175Hz pulse</tspan>
        <tspan x="10" dy="12">dislodges water in slit.</tspan>
      </text>
    </g>
  </g>

  <!-- 3. Xiaomi / OnePlus -->
  <g transform="translate(535, 80)">
    <rect x="0" y="0" width="220" height="300" rx="12" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="28" rx="6" fill="#7c2d12"/>
    <text x="110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fed7aa" text-anchor="middle">XIAOMI &amp; ONEPLUS</text>

    <!-- Visual Speaker Cutout (Independent top speaker holes) -->
    <rect x="25" y="55" width="170" height="70" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="110" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Top &amp; Bottom Drilled Holes</text>
    <!-- Array of micro holes -->
    <g transform="translate(50, 88)">
      <circle cx="10" cy="7" r="5" fill="#030712" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="35" cy="7" r="5" fill="#030712" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="60" cy="7" r="5" fill="#030712" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="85" cy="7" r="5" fill="#030712" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="110" cy="7" r="5" fill="#030712" stroke="#f97316" stroke-width="1.5"/>
    </g>

    <!-- Key Characteristics -->
    <g transform="translate(15, 140)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Dedicated Top Chamber</text>
      <text x="10" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">True dual stereo drivers,</tspan>
        <tspan x="10" dy="12">not shared with earpiece.</tspan>
      </text>

      <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• Clear Speaker Feature</text>
      <text x="10" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fb923c">
        <tspan x="10" dy="0">MIUI / HyperOS has</tspan>
        <tspan x="10" dy="12">built-in 30s sonic clear siren.</tspan>
      </text>

      <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3f4f6">• High SPL Drivers</text>
      <text x="10" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#9ca3af">
        <tspan x="10" dy="0">Generates up to 88dB; safe</tspan>
        <tspan x="10" dy="12">for full acoustic ejection.</tspan>
      </text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Acoustic Engineering Reference • Cross-Brand OEM Speaker Architecture Standards</text>
</svg>
