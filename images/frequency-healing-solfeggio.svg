<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad9)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title Badge -->
  <rect x="200" y="22" width="400" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">POPULAR AUDIO FREQUENCY PRESETS GUIDE</text>

  <!-- 4 Preset Columns -->
  <!-- 1. 165 Hz Water Eject -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="165" height="300" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="82" cy="50" r="32" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
    <text x="82" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#38bdf8" text-anchor="middle">165Hz</text>

    <text x="82" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Water Eject</text>
    <text x="82" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#06b6d4" text-anchor="middle">Acoustic Cleanser</text>

    <rect x="12" y="135" width="141" height="1" fill="#1e293b"/>
    <g transform="translate(15, 150)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Mechanical Focus</text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Matches speaker port</tspan>
        <tspan x="0" dy="11">acoustic resonance.</tspan>
      </text>

      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Function</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Pumps air outward to</tspan>
        <tspan x="0" dy="11">expel water &amp; debris.</tspan>
      </text>

      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Waveform</text>
      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">Sine / Low Sine Pulsed</text>
    </g>
  </g>

  <!-- 2. 432 Hz Natural Concert -->
  <g transform="translate(225, 80)">
    <rect x="0" y="0" width="165" height="300" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="82" cy="50" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">432Hz</text>

    <text x="82" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Verdi Tuning</text>
    <text x="82" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">Natural Resonance</text>

    <rect x="12" y="135" width="141" height="1" fill="#1e293b"/>
    <g transform="translate(15, 150)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Historical Root</text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Scientific pitch favored</tspan>
        <tspan x="0" dy="11">by Giuseppe Verdi.</tspan>
      </text>

      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Perception</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Warmer, relaxed sound</tspan>
        <tspan x="0" dy="11">with softer timbre.</tspan>
      </text>

      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Waveform</text>
      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Pure Sine Oscillator</text>
    </g>
  </g>

  <!-- 3. 440 Hz Standard Pitch -->
  <g transform="translate(405, 80)">
    <rect x="0" y="0" width="165" height="300" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="82" cy="50" r="32" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="82" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">440Hz</text>

    <text x="82" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ISO 16 Standard</text>
    <text x="82" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">Concert Pitch A4</text>

    <rect x="12" y="135" width="141" height="1" fill="#1e293b"/>
    <g transform="translate(15, 150)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Benchmark</text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">International standard</tspan>
        <tspan x="0" dy="11">for tuning instruments.</tspan>
      </text>

      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Testing Use</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Accurate calibration</tspan>
        <tspan x="0" dy="11">for speakers &amp; mics.</tspan>
      </text>

      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Waveform</text>
      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fbbf24">Sine / Triangle Wave</text>
    </g>
  </g>

  <!-- 4. 528 Hz Solfeggio -->
  <g transform="translate(585, 80)">
    <rect x="0" y="0" width="165" height="300" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="82" cy="50" r="32" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="82" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#c084fc" text-anchor="middle">528Hz</text>

    <text x="82" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Solfeggio Scale</text>
    <text x="82" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">Transformation Tone</text>

    <rect x="12" y="135" width="141" height="1" fill="#1e293b"/>
    <g transform="translate(15, 150)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Acoustic Lore</text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Ancient scale tone for</tspan>
        <tspan x="0" dy="11">clarity &amp; calm focus.</tspan>
      </text>

      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• High Clarity</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">
        <tspan x="0" dy="0">Clean midrange audio</tspan>
        <tspan x="0" dy="11">reproduction test.</tspan>
      </text>

      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Waveform</text>
      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#c084fc">Sine Wave Generator</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">iFixMySpeaker Acoustic Frequency Laboratory • Precision Web Audio Frequency Generator</text>
</svg>
