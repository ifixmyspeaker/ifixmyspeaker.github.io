<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title Badge -->
  <rect x="220" y="20" width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">IPHONE ACOUSTIC PORT ANATOMY &amp; CLEANING</text>

  <!-- Section 1: Bottom Edge Macro View -->
  <g transform="translate(60, 90)">
    <!-- Chassis Bar -->
    <rect x="0" y="40" width="680" height="110" rx="36" fill="url(#metalGrad)" stroke="#475569" stroke-width="2.5"/>
    <rect x="8" y="48" width="664" height="94" rx="28" fill="#030712"/>

    <!-- Left Side: Microphone Ports (NOT speakers) -->
    <!-- 3 or 4 small holes -->
    <g transform="translate(90, 85)">
      <circle cx="0" cy="10" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="0" cy="10" r="5" fill="#000000"/>
      <circle cx="30" cy="10" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="30" cy="10" r="5" fill="#000000"/>
      <circle cx="60" cy="10" r="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="60" cy="10" r="5" fill="#000000"/>
    </g>

    <!-- Center: Lightning / USB-C Port -->
    <rect x="290" y="80" width="100" height="30" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="315" y="90" width="50" height="10" rx="4" fill="#000000" stroke="#334155" stroke-width="1"/>

    <!-- Right Side: Main Loudspeaker Holes (Actual Audio Driver) -->
    <!-- 5 larger holes with cyan highlight -->
    <g transform="translate(480, 85)">
      <circle cx="0" cy="10" r="9" fill="#083344" stroke="#06b6d4" stroke-width="2" filter="url(#glow3)"/>
      <circle cx="0" cy="10" r="6" fill="#000000"/>
      <circle cx="28" cy="10" r="9" fill="#083344" stroke="#06b6d4" stroke-width="2" filter="url(#glow3)"/>
      <circle cx="28" cy="10" r="6" fill="#000000"/>
      <circle cx="56" cy="10" r="9" fill="#083344" stroke="#06b6d4" stroke-width="2" filter="url(#glow3)"/>
      <circle cx="56" cy="10" r="6" fill="#000000"/>
      <circle cx="84" cy="10" r="9" fill="#083344" stroke="#06b6d4" stroke-width="2" filter="url(#glow3)"/>
      <circle cx="84" cy="10" r="6" fill="#000000"/>
      <circle cx="112" cy="10" r="9" fill="#083344" stroke="#06b6d4" stroke-width="2" filter="url(#glow3)"/>
      <circle cx="112" cy="10" r="6" fill="#000000"/>
    </g>

    <!-- Callout 1: Left Grille (Microphone) -->
    <line x1="120" y1="80" x2="120" y2="10" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="120" cy="80" r="4" fill="#ef4444"/>
    <rect x="20" y="-15" width="200" height="30" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="120" y="4" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">LEFT: MICROPHONE ONLY</text>

    <!-- Callout 2: Center (Charging Port) -->
    <line x1="340" y1="115" x2="340" y2="165" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="340" cy="115" r="4" fill="#64748b"/>
    <rect x="250" y="165" width="180" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="340" y="183" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">USB-C / Lightning Port</text>

    <!-- Callout 3: Right Grille (Main Speaker) -->
    <line x1="535" y1="80" x2="535" y2="10" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="535" cy="80" r="4" fill="#06b6d4"/>
    <rect x="425" y="-15" width="220" height="30" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="535" y="4" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">RIGHT: MAIN LOUDSPEAKER</text>
  </g>

  <!-- Explanatory Warning & Safety Cards -->
  <g transform="translate(60, 305)">
    <!-- Card 1: Common Misconception -->
    <rect x="0" y="0" width="325" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="26" cy="26" r="12" fill="#f59e0b" opacity="0.2"/>
    <text x="26" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">!</text>
    <text x="50" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#fef08a">The "Broken Left Speaker" Myth</text>
    <text x="16" y="55" font-family="sans-serif" font-size="11" fill="#cbd5e1" width="290">No sound comes out of the bottom left holes because they house the primary call microphone, not a speaker driver.</text>
    <text x="16" y="85" font-family="sans-serif" font-size="10" font-weight="600" fill="#f59e0b">Do NOT poke pins into these delicate mic membranes!</text>

    <!-- Card 2: Safe Cleaning Protocol -->
    <rect x="355" y="0" width="325" height="100" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="381" cy="26" r="12" fill="#10b981" opacity="0.25"/>
    <text x="381" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">&#x2713;</text>
    <text x="405" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Certified Cleaning Protocol</text>
    <text x="371" y="55" font-family="sans-serif" font-size="11" fill="#d1fae5">1. Soft super-fine ESD nylon brush held at a 45° angle.</text>
    <text x="371" y="72" font-family="sans-serif" font-size="11" fill="#d1fae5">2. Run iFixMySpeaker 165Hz tone to shake trapped grime loose.</text>
    <text x="371" y="88" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">NEVER use canned compressed air or metal paperclips.</text>
  </g>

  <!-- Lab footer -->
  <text x="400" y="430" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">iFixMySpeaker Hardware Engineering Guide • Apple iPhone 11 through 16 Pro Architecture</text>
</svg>
