  <!-- 4 Stage Detail Cards -->
  <!-- Card 1: 0 - 15 Mins -->
  <g transform="translate(45, 170)">
    <rect x="0" y="0" width="160" height="210" rx="10" fill="#062e22" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="24" rx="4" fill="#064e3b"/>
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">0 – 15 MINUTES</text>
    <text x="80" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">The Golden Window</text>
    <text x="12" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d1fae5">
      <tspan x="12" dy="0">Water is trapped only</tspan>
