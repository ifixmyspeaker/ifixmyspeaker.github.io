    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ACTION:</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fde68a">• Seal in silica gel pack</text>
    <text x="16" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fde68a">• Cool fan airflow</text>
    <text x="16" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ef4444">• Do NOT use raw rice</text>
  </g>

  <!-- Card 4: 24+ Hours -->
  <g transform="translate(585, 170)">
    <rect x="0" y="0" width="160" height="210" rx="10" fill="#2d0f0f" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="24" rx="4" fill="#450a0a"/>
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">24+ HOURS</text>
