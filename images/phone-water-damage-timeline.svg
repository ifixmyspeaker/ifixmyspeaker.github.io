  <circle cx="120" cy="130" r="14" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
  <text x="120" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#a7f3d0" text-anchor="middle">1</text>

  <!-- Stage 2 -->
  <circle cx="280" cy="130" r="14" fill="#083344" stroke="#06b6d4" stroke-width="3"/>
  <text x="280" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#67e8f9" text-anchor="middle">2</text>

  <!-- Stage 3 -->
  <circle cx="480" cy="130" r="14" fill="#451a03" stroke="#f59e0b" stroke-width="3"/>
  <text x="480" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#fde68a" text-anchor="middle">3</text>

  <!-- Stage 4 -->
