  <!-- Footer -->
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Empirical Acoustic Research • Smartphone Liquid Ingress &amp; Corrosion Kinetics</text>
