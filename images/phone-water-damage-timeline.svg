<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad10)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title Badge -->
  <rect x="200" y="22" width="400" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PHONE WATER DAMAGE EMERGENCY TIMELINE</text>

  <!-- Horizontal Timeline Bar -->
  <line x1="80" y1="130" x2="720" y2="130" stroke="#334155" stroke-width="4"/>
  <!-- Progress color gradient line -->
