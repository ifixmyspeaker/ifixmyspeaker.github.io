    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">ACTION:</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0">• Power down</text>
    <text x="16" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0">• Dry exterior</text>
    <text x="16" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0">• Run 165Hz Ejection</text>
  </g>

  <!-- Card 2: 15 - 60 Mins -->
  <g transform="translate(225, 170)">
    <rect x="0" y="0" width="160" height="210" rx="10" fill="#08283b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="10" y="10" width="140" height="24" rx="4" fill="#083344"/>
