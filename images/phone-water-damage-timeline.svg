  <line x1="240" y1="130" x2="400" y2="130" stroke="#06b6d4" stroke-width="4"/>
  <line x1="400" y1="130" x2="560" y2="130" stroke="#f59e0b" stroke-width="4"/>
  <line x1="560" y1="130" x2="720" y2="130" stroke="#ef4444" stroke-width="4"/>

