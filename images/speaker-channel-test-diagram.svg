<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenWave" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="250" y1="0" x2="250" y2="450"/>
    <line x1="550" y1="0" x2="550" y2="450"/>
    <line x1="650" y1="0" x2="650" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Title Badge -->
  <rect x="230" y="24" width="340" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">STEREO ACOUSTIC CHANNEL ROUTING</text>

  <!-- Left Channel Soundwaves (Cyan) -->
  <g filter="url(#glow)">
    <path d="M 330 130 C 270 110, 220 90, 160 80" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
    <path d="M 330 140 C 250 130, 180 120, 110 110" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
    <path d="M 330 150 C 230 150, 140 160, 70 170" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M 330 160 C 250 170, 180 190, 110 210" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
    <path d="M 330 170 C 270 190, 220 220, 160 240" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
  </g>

  <!-- Right Channel Soundwaves (Lime Green) -->
  <g filter="url(#glow)">
    <path d="M 470 280 C 530 260, 580 230, 640 210" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
    <path d="M 470 290 C 550 280, 620 270, 690 260" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8"/>
    <path d="M 470 300 C 570 300, 660 310, 730 320" fill="none" stroke="#34d399" stroke-width="3.5"/>
    <path d="M 470 310 C 550 320, 620 340, 690 360" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8"/>
    <path d="M 470 320 C 530 340, 580 370, 640 390" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
  </g>

  <!-- Smartphone Center Frame -->
  <rect x="340" y="80" width="120" height="280" rx="22" fill="url(#phoneGrad)" stroke="#475569" stroke-width="3"/>
  <rect x="348" y="96" width="104" height="248" rx="14" fill="#030712"/>

  <!-- Screen Content (Oscilloscope Graphic) -->
  <rect x="354" y="110" width="92" height="60" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <path d="M 358 140 Q 375 115, 385 140 T 400 140 T 415 125 T 430 155 T 442 140" fill="none" stroke="#38bdf8" stroke-width="2"/>
  
  <rect x="354" y="270" width="92" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <path d="M 358 300 Q 370 315, 385 300 T 400 300 T 415 285 T 430 315 T 442 300" fill="none" stroke="#34d399" stroke-width="2"/>

  <!-- Top Earpiece Speaker (Channel L) -->
  <rect x="380" y="88" width="40" height="4" rx="2" fill="#38bdf8"/>
  <circle cx="370" cy="90" r="2.5" fill="#64748b"/>
  <!-- Top Speaker Marker & Callout -->
  <circle cx="400" cy="90" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="380" y1="90" x2="220" y2="120" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Bottom Loudspeaker (Channel R) -->
  <rect x="360" y="352" width="28" height="4" rx="2" fill="#10b981"/>
  <rect x="396" y="352" width="8" height="4" rx="1.5" fill="#64748b"/>
  <rect x="412" y="352" width="28" height="4" rx="2" fill="#10b981"/>
  <!-- Bottom Speaker Marker & Callout -->
  <circle cx="426" cy="354" r="5" fill="#10b981" filter="url(#glow)"/>
  <line x1="430" y1="354" x2="580" y2="330" stroke="#10b981" stroke-width="1.5"/>

  <!-- Left Channel Detail Card -->
  <rect x="25" y="100" width="226" height="110" rx="12" fill="#0f172a" stroke="#0891b2" stroke-width="1.5" opacity="0.95"/>
  <rect x="39" y="112" width="60" height="20" rx="10" fill="#0891b2" opacity="0.3"/>
  <text x="69" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">CHANNEL L</text>
  <text x="39" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Top Earpiece Speaker</text>
  <text x="39" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Voice frequencies (300Hz - 8kHz)</text>
  <text x="39" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">High Treble &amp; Stereo Stage</text>

  <!-- Right Channel Detail Card -->
  <rect x="549" y="270" width="226" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
  <rect x="563" y="282" width="60" height="20" rx="10" fill="#10b981" opacity="0.3"/>
  <text x="593" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">CHANNEL R</text>
  <text x="563" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Bottom Loudspeaker</text>
  <text x="563" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Full-range driver (80Hz - 20kHz)</text>
  <text x="563" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">Bass Resonance &amp; Maximum SPL</text>

  <!-- Footer Specification -->
  <text x="400" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">iFixMySpeaker Acoustic Lab Diagnostics • IEC 60268-5 Compliant Sound Isolation Test</text>
</svg>
