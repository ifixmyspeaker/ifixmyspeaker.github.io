<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title Badge -->
  <rect x="220" y="20" width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SPEAKER CLEANING TOOLS: SAFE VS DANGEROUS</text>

  <!-- Left Column: DANGEROUS (Red) -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="335" height="320" rx="14" fill="#1e131d" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="305" height="34" rx="8" fill="#7f1d1d"/>
    <text x="167" y="38" font-family="sans-serif" font-size="14" font-weight="800" fill="#fca5a5" text-anchor="middle">&#x2717; DANGEROUS: NEVER USE</text>

    <!-- Item 1: Sewing needles / Safety pins -->
    <g transform="translate(20, 65)">
      <circle cx="16" cy="16" r="14" fill="#991b1b"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#fecaca" text-anchor="middle">&#x2715;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Sewing Needles &amp; Paperclips</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#fca5a5">Punctures delicate acoustic Gore-Tex mesh &amp; voice coil.</text>
    </g>

    <!-- Item 2: Canned Compressed Air -->
    <g transform="translate(20, 125)">
      <circle cx="16" cy="16" r="14" fill="#991b1b"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#fecaca" text-anchor="middle">&#x2715;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Canned Compressed Air</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#fca5a5">Overpressurizes speaker chamber; tears driver cone.</text>
    </g>

    <!-- Item 3: Raw Uncooked Rice -->
    <g transform="translate(20, 185)">
      <circle cx="16" cy="16" r="14" fill="#991b1b"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#fecaca" text-anchor="middle">&#x2715;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Uncooked Rice Submersion</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#fca5a5">Fine starch dust forms glue-like paste inside wet ports.</text>
    </g>

    <!-- Item 4: High-Heat Hair Dryer -->
    <g transform="translate(20, 245)">
      <circle cx="16" cy="16" r="14" fill="#991b1b"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#fecaca" text-anchor="middle">&#x2715;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">High-Heat Blow Dryers</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#fca5a5">Melts water-resistant acoustic adhesive and destroys seals.</text>
    </g>
  </g>

  <!-- Right Column: SAFE & RECOMMENDED (Green) -->
  <g transform="translate(420, 75)">
    <rect x="0" y="0" width="335" height="320" rx="14" fill="#0c1e19" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="305" height="34" rx="8" fill="#065f46"/>
    <text x="167" y="38" font-family="sans-serif" font-size="14" font-weight="800" fill="#a7f3d0" text-anchor="middle">&#x2713; RECOMMENDED: LAB VERIFIED</text>

    <!-- Item 1: Soft Nylon Bristle Brush -->
    <g transform="translate(20, 65)">
      <circle cx="16" cy="16" r="14" fill="#047857"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#d1fae5" text-anchor="middle">&#x2713;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Soft Fine Bristle ESD Brush</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#6ee7b7">Gently sweeps external lint away at a 45° angle safely.</text>
    </g>

    <!-- Item 2: Blu-Tack / Cleaning Putty -->
    <g transform="translate(20, 125)">
      <circle cx="16" cy="16" r="14" fill="#047857"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#d1fae5" text-anchor="middle">&#x2713;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Acoustic Cleaning Putty (Blu-Tack)</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#6ee7b7">Press lightly and peel: lifts pocket wax &amp; dust cleanly.</text>
    </g>

    <!-- Item 3: 165Hz Acoustic Pulse Sound -->
    <g transform="translate(20, 185)">
      <circle cx="16" cy="16" r="14" fill="#047857"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#d1fae5" text-anchor="middle">&#x2713;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">iFixMySpeaker 165Hz Tone</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#6ee7b7">Oscillates diaphragm to expel trapped moisture droplets.</text>
    </g>

    <!-- Item 4: 90%+ Isopropyl Alcohol (Swab) -->
    <g transform="translate(20, 245)">
      <circle cx="16" cy="16" r="14" fill="#047857"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#d1fae5" text-anchor="middle">&#x2713;</text>
      <text x="40" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">90%+ Isopropyl on Micro-Swab</text>
      <text x="40" y="32" font-family="sans-serif" font-size="11" fill="#6ee7b7">Dissolves oil/earwax on metal surface; dries in seconds.</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="425" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Acoustic Maintenance Best Practices • Approved by Hardware Repair Specialists</text>
</svg>
